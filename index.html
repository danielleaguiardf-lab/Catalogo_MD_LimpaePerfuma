<style data-keep>
/* Layout: navy store band, sticky filter bar, product grid; cart opens as a sheet from the bottom bar. */

.sd{position:relative;overflow:hidden;color:#111;background:#FFD23F;background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.18) 0 14px,transparent 14px 30px);border-bottom:4px solid #111}

.sd-tick i{font-style:normal;color:#E0262B}

.sd-k{display:inline-block;background:#E0262B;color:#fff;font-weight:900;font-size:.72rem;letter-spacing:1px;text-transform:uppercase;padding:4px 10px;border-radius:6px;transform:rotate(-2deg)}

function kitLines(items){
  var out = [];
  /* kit montado: cada item pelo preço de 1 unidade (sem atacado); o desconto do kit entra só no total */
  (items || []).forEach(function(it){
    var p = byId(it.id); if (!p || !(it.qty > 0)) return;
    var up = p.price;
    out.push({ id: it.id, p: p, aroma: it.aroma || "", qty: it.qty, unit: up, total: up * it.qty });
  });
  return out;
}
function kitTotal(lines){ return lines.reduce(function(a, l){ return a + l.total; }, 0); }

function kitCount(lines){ return lines.reduce(function(a, l){ return a + l.qty; }, 0); }

function wrapText(ctx, text, maxW){
  var words = String(text).split(" "), lines = [], cur = "";
  words.forEach(function(w){ var t = cur ? cur + " " + w : w; if (ctx.measureText(t).width > maxW && cur){ lines.push(cur); cur = w; } else cur = t; });

}

      var tx = x0 + PH + 30, ty = y + 34;

      ctx.fillStyle = "#55606B"; ctx.font = F(500, 26);
      (r.s || []).forEach(function(s){ wrapText(ctx, "• " + s, textW).forEach(function(l){ ctx.fillText(l, tx, ty); ty += 34; }); });

    y += 30;
    line("Subtotal (descontos aplicados)", d.st);

var trkObs = null, trkSeen = {};
function trkObserve(){
  if (!("IntersectionObserver" in window) || trkOff()) return;
  if (!trkObs) trkObs = new IntersectionObserver(function(ents){
    ents.forEach(function(en){
      var el = en.target, id = el.getAttribute("data-pid");
      if (en.isIntersecting && en.intersectionRatio >= 0.5){
        if (trkSeen[id] || el._tv) return;
        el._tv = setTimeout(function(){ trkSeen[id] = 1; var pi = prodInfo(id); track("Viu produto", { pid: id, pn: pi.pn, cat: pi.cat, val: pi.price }, "v:" + id); trkObs.unobserve(el); }, 1200);
      } else if (el._tv){ clearTimeout(el._tv); el._tv = null; }
    });
  }, { threshold: [0, 0.5] });
  document.querySelectorAll("article[data-pid]").forEach(function(el){ if (!trkSeen[el.getAttribute("data-pid")]) trkObs.observe(el); });
}

function adminClick(e){

function onEditInput(e){

function shrink(file, cb){
  var fr = new FileReader();
  fr.onload = function(){
    var img = new Image();
    img.onload = function(){
      var max = 480, w = img.width, h = img.height, s = Math.min(1, max / Math.max(w, h));
      var c = document.createElement("canvas"); c.width = Math.round(w * s); c.height = Math.round(h * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      try { cb(c.toDataURL("image/jpeg", 0.8)); } catch(e){ cb(null); }
    };
    img.onerror = function(){ cb(null); };
    img.src = fr.result;
  };
  fr.onerror = function(){ cb(null); };
  fr.readAsDataURL(file);
}
function status(t){ var s = document.getElementById("ed-status"); if (s) s.textContent = t; }
function problems(d){
  var out = [];
  d.products.forEach(function(p, i){
    if (!p.name || !p.name.trim()) out.push("Um produto está sem nome.");
    else if (p.price == null) out.push("\"" + p.name + "\" está sem preço.");
    if (!p.category || !p.category.trim()) p.category = "Outros";
  });
  d.shipping = d.shipping.filter(function(r){ return r.city && r.city.trim(); });
  if (String(d.store.whatsapp || "").replace(/\D/g, "").length < 10) out.push("Confira o número de WhatsApp (com DDD).");
  return out;
}
function documentFrom(data){
  var reset = (document.head.querySelector("style") || {}).textContent || "";
  var keep = Array.prototype.map.call(document.querySelectorAll("[data-keep]"), function(el){ return el.outerHTML; }).join("");
  var json = JSON.stringify(data).replace(/</g, "\\u003c");
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + '</style></head><body>' +
    keep + '<div id="app"></div><script type="application/json" id="catalog-data">' + json + '<\/script>' + document.getElementById("app-js").outerHTML + '</body></html>';
}
async function publishDraft(){
  var d = clone(draft);
  var errs = problems(d);
  if (errs.length){ status(errs[0]); return; }
  d.store.whatsapp = String(d.store.whatsapp).replace(/\D/g, "");
  var art = await claude.use("artifact");
  if (!art){ status("Não foi possível salvar daqui. Abra o catálogo no Claude para editar."); return; }
  status("Salvando...");
  try { sessionStorage.setItem("md-draft", JSON.stringify(draft)); } catch(e){}
  try {
    await art.publish(documentFrom(d));
    try { sessionStorage.removeItem("md-draft"); } catch(e){}
    status("Catálogo publicado.");
  } catch(err){
    var code = err && err.code;
    if (code === "conflict") status("Outra versão foi salva agora há pouco. A página vai recarregar com ela; suas alterações continuam no editor.");
    else if (code === "not_writer" || code === "not_granted") { try { sessionStorage.removeItem("md-draft"); } catch(e){} status("Esta conta não tem permissão para editar o catálogo."); }
    else status("Não foi possível salvar agora (" + (code || "erro") + "). Tente de novo em instantes.");
  }
}

var _dr = loadDraft();
if (_dr){ usingDraft = true; CTRL = _dr; }
build(); renderShell(); trkStart();
function sameCtrl(a, b){ var x = jclone(a), y = jclone(b); delete x.versao; delete y.versao; return JSON.stringify(x) === JSON.stringify(y); }
try {
  fetch("controle.json?v=" + Date.now(), { cache: "no-store" }).then(function(r){ return r.ok ? r.json() : null; }).then(function(c){
    if (!c || !c.kits || !c.avulsos || !c.black) return;
    publishedCtrl = c;
    if (usingDraft){
      if (sameCtrl(c, CTRL)){ usingDraft = false; try { localStorage.removeItem(ADMIN_DRAFT_KEY); } catch(e){} draftBar(); }
      return;
    }
    if (sameCtrl(c, CTRL)) return;
    applyCtrl(c); renderShell(); hashRoute();
  }).catch(function(){});
} catch(e){}
function pedidoCode(){ var m = location.search.match(/[?&]pedido=([^&#]+)/); if (m) return m[1]; return location.hash.indexOf("#pedido=") === 0 ? location.hash.slice(8) : ""; }
function hashRoute(){ var pc = pedidoCode(); if (location.hash === "#admin") openAdmin(); else if (pc) openOrderView(pc); }
window.addEventListener("hashchange", hashRoute); hashRoute();
})();
