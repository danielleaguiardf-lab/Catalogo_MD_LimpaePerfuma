<style data-keep>
/* Layout: navy store band, sticky filter bar, product grid; cart opens as a sheet from the bottom bar. */
:root{
  --bg:#F3F8F8; --surface:#FFFFFF; --surface-2:#E8F3F2; --ink:#10223F; --muted:#4E6077; --line:#D3E2E3;
  --navy:#0E2F6E; --navy-ink:#FFFFFF; --aqua:#13A89C; --aqua-ink:#FFFFFF; --aqua-soft:#D9F3F0;
  --ok:#1F8A4C; --warn-bg:#FFF4D6; --warn-ink:#6B4A00; --danger:#B42318;
  --font-display:"Playfair Display", Georgia, "Times New Roman", serif;
  --font-body:"Nunito Sans", "Segoe UI", system-ui, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1424; --surface:#111F35; --surface-2:#16294A; --ink:#E7EEF8; --muted:#A3B3C9; --line:#243A5E;
  --navy:#0B2350; --navy-ink:#FFFFFF; --aqua:#35CDBF; --aqua-ink:#06231F; --aqua-soft:#0F3A3A;
  --ok:#5FD08F; --warn-bg:#3A2E0B; --warn-ink:#FFE39A; --danger:#FF8A80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1424; --surface:#111F35; --surface-2:#16294A; --ink:#E7EEF8; --muted:#A3B3C9; --line:#243A5E;
  --navy:#0B2350; --navy-ink:#FFFFFF; --aqua:#35CDBF; --aqua-ink:#06231F; --aqua-soft:#0F3A3A;
  --ok:#5FD08F; --warn-bg:#3A2E0B; --warn-ink:#FFE39A; --danger:#FF8A80; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--aqua);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1,h2,h3{text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}

/* store band */
.band{background:var(--navy);color:var(--navy-ink)}
.band .wrap{padding-block:22px 26px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.logo{width:84px;height:84px;border-radius:50%;flex:none;background:#fff}
.brand{flex:1 1 260px;min-width:0}
.brand h1{font-family:var(--font-display);font-size:clamp(1.6rem,4vw,2.3rem);line-height:1.1;letter-spacing:.2px}
.brand h1 b{color:#4FE0D2;font-weight:800}
.brand p{margin:4px 0 0;opacity:.9;font-style:italic}
.perks{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding:0;list-style:none}
.perks li{font-size:.82rem;font-weight:700;letter-spacing:.2px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22)}
.edit-btn{background:transparent;border:1.5px solid rgba(255,255,255,.55);color:#fff;border-radius:10px;padding:8px 14px;font-weight:700;min-height:44px}

/* toolbar */
.toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.toolbar .wrap{padding-block:12px;display:flex;flex-direction:column;gap:10px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:46px}
.search input{border:0;background:transparent;outline:none;flex:1;min-width:0;padding:10px 0}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;font-size:.9rem;min-height:40px}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}

.notice{margin:16px 0 0;padding:12px 14px;border-radius:12px;background:var(--warn-bg);color:var(--warn-ink);font-size:.92rem}

/* grid */
main{padding-block:18px 120px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden;min-width:0}
.pic{aspect-ratio:4/3;max-width:100%;background:var(--surface-2);display:grid;place-items:center;position:relative}
.pic img{width:100%;height:100%;object-fit:cover}
.pic svg{width:44%;height:auto}
.tag{position:absolute;top:10px;left:10px;font-size:.72rem;font-weight:800;letter-spacing:.6px;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.tag.out{left:auto;right:10px;color:var(--danger)}
.body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.cat{font-size:.74rem;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--aqua)}
.card h3{font-size:1.06rem;line-height:1.3}
.size{color:var(--muted);font-size:.9rem}
.desc{color:var(--muted);font-size:.9rem;margin:0}
.price{font-size:1.45rem;font-weight:800;color:var(--navy)}
:root[data-theme="dark"] .price{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .price{color:var(--ink)}}
.tier{font-size:.86rem;font-weight:700;color:var(--ok)}

.aroma{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
.aroma select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;min-height:42px}
.actions{margin-top:auto;padding-top:6px}
.add{width:100%;min-height:46px;border:0;border-radius:12px;background:var(--aqua);color:var(--aqua-ink);font-weight:800;font-size:1rem}
.add:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.stepper{display:flex;align-items:center;justify-content:space-between;border:1.5px solid var(--aqua);border-radius:12px;min-height:46px}
.stepper button{width:48px;min-height:44px;border:0;background:transparent;font-size:1.4rem;font-weight:800;color:var(--aqua)}
.stepper span{font-weight:800}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}

.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--navy);color:#fff;padding-bottom:env(safe-area-inset-bottom,0px)}
.cartbar .wrap{padding-block:10px;display:flex;align-items:center;gap:12px}

.cartbar .sum small{display:block;opacity:.85}
.cartbar button{border:0;border-radius:12px;background:#4FE0D2;color:#06231F;font-weight:800;padding:10px 18px;min-height:46px}

/* sheet */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(5,14,30,.55)}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:760px){.sheet{left:auto;top:0;max-height:none;width:460px;border-radius:0;padding-top:env(safe-area-inset-top,0px)}}
.sheet-head{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:1}
.sheet-head .in{display:flex;align-items:center;justify-content:space-between;padding:14px max(18px,env(safe-area-inset-right,0px)) 14px max(18px,env(safe-area-inset-left,0px))}
.sheet-head h2{font-family:var(--font-display);font-size:1.5rem}
.x{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-width:44px;min-height:44px;font-size:1.2rem}
.sec{padding:16px max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sec h3{font-size:.8rem;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.line{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.line .nm{font-weight:700;min-width:0}
.line .nm small{display:block;color:var(--muted);font-weight:600}
.line .tot{font-weight:800;text-align:right}
.line .ctl{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px}
.line .stepper{min-height:40px;width:150px}
.rm{border:0;background:transparent;color:var(--danger);font-weight:700;min-height:44px;padding:0 6px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-weight:700;font-size:.9rem}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:46px;width:100%}
.field textarea{min-height:70px;resize:vertical}
.field .err{color:var(--danger);font-size:.85rem;font-weight:700}
.row2{display:grid;grid-template-columns:1fr 110px;gap:10px}
.ship{padding:12px 14px;border-radius:12px;background:var(--aqua-soft);font-weight:700}
.ship small{display:block;font-weight:600;color:var(--muted)}
.totals{border-top:1px dashed var(--line);padding-top:10px;display:grid;grid-template-columns:1fr auto;gap:6px}
.totals .grand{font-size:1.25rem;font-weight:800}
.wa{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;border-radius:14px;background:#1FA855;color:#fff;font-weight:800;font-size:1.05rem;text-decoration:none}
.wa svg{width:22px;height:22px}
.fine{font-size:.85rem;color:var(--muted)}
.copy{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:700;min-height:44px}

/* editor */
.editor{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.ed-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.ed-head h2{font-family:var(--font-display);font-size:1.6rem}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:800;min-height:46px}
.btn.primary{background:var(--aqua);color:var(--aqua-ink)}
.btn.ghost{background:var(--surface);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{font-size:1.05rem}
.egrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.ship-table{overflow-x:auto}
.ship-table table{border-collapse:collapse;width:100%;min-width:480px}
.ship-table th,.ship-table td{padding:6px;text-align:left;border-bottom:1px solid var(--line);font-size:.9rem}
.ship-table input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px;width:100%;min-height:40px}
.ep-photo{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ep-photo .thumb{width:84px;height:64px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden;flex:none}
.ep-photo .thumb img{width:100%;height:100%;object-fit:cover}
.check{display:flex;gap:8px;align-items:center;font-weight:700}
.check input{width:20px;height:20px}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.savebar .wrap{padding-block:10px;display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.status{flex:1;min-width:160px;font-weight:700;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s ease}.card:hover{transform:translateY(-2px)}}

function load(k){ try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch(e){ return null; } }
function save(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
var brl = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
function money(n){ return brl.format(n || 0); }
function num(v){ var s = String(v == null ? "" : v).trim(); if (!s) return null; if (s.indexOf(",") >= 0) s = s.replace(/\./g, "").replace(",", "."); var n = parseFloat(s); return isNaN(n) ? null : n; }
function byId(id){ for (var i = 0; i < DATA.products.length; i++) if (DATA.products[i].id === id) return DATA.products[i]; return null; }
function unitPrice(p, qty){ return (p.tierMin && p.tierPrice != null && qty >= p.tierMin) ? p.tierPrice : p.price; }
function phoneDigits(){ var d = String(DATA.store.whatsapp || "").replace(/\D/g, ""); if (d.length <= 11) d = "55" + d; return d; }
function phonePretty(){ var d = phoneDigits().slice(2); return d.length === 11 ? "(" + d.slice(0,2) + ") " + d.slice(2,7) + "-" + d.slice(7) : d; }

function icon(cat){
  var c = String(cat || "").toLowerCase();
  var col = "#13A89C", body;
  if (c.indexOf("kit") >= 0){ col = "#0E2F6E";
    body = '<rect x="14" y="40" width="72" height="46" rx="6" fill="'+col+'"/><rect x="10" y="30" width="80" height="16" rx="5" fill="#13A89C"/><rect x="45" y="30" width="10" height="56" fill="#4FE0D2"/><path d="M50 30 C40 14 26 20 34 28 Z M50 30 C60 14 74 20 66 28 Z" fill="#4FE0D2"/>';
  } else if (c.indexOf("roupa") >= 0 || c.indexOf("amaciante") >= 0 || c.indexOf("lavanderia") >= 0){ col = "#5B6CD9";
    body = '<rect x="26" y="22" width="48" height="66" rx="12" fill="'+col+'"/><rect x="38" y="10" width="24" height="14" rx="4" fill="#0E2F6E"/><path d="M60 22 h18 a6 6 0 0 1 6 6 v18 a6 6 0 0 1 -6 6 h-4" stroke="'+col+'" stroke-width="7" fill="none"/><circle cx="50" cy="56" r="13" fill="#fff" opacity=".85"/>';
  } else if (c.indexOf("cozinha") >= 0 || c.indexOf("louça") >= 0 || c.indexOf("detergente") >= 0){ col = "#1FA855";
    body = '<path d="M36 34 h28 l6 54 h-40 z" fill="'+col+'"/><rect x="42" y="18" width="16" height="18" rx="3" fill="#0E2F6E"/><rect x="47" y="8" width="6" height="12" fill="#0E2F6E"/><circle cx="76" cy="26" r="7" fill="#9FE3F5"/><circle cx="84" cy="40" r="4.5" fill="#9FE3F5"/>';
  } else {
    body = '<path d="M30 40 q0 -10 10 -10 h20 q10 0 10 10 v42 q0 8 -8 8 h-24 q-8 0 -8 -8 z" fill="'+col+'"/><rect x="40" y="16" width="20" height="16" rx="3" fill="#0E2F6E"/><path d="M60 20 h18 v8 h-12" fill="#0E2F6E"/><circle cx="82" cy="18" r="3" fill="#4FE0D2"/><circle cx="88" cy="26" r="2.5" fill="#4FE0D2"/><rect x="38" y="50" width="24" height="18" rx="3" fill="#fff" opacity=".85"/>';
  }
  return '<svg viewBox="0 0 100 100" aria-hidden="true">' + body + '</svg>';
}

function cartKey(id, aroma){ return id + "|" + (aroma || ""); }
function cartItems(){
  var out = [];
  Object.keys(cart).forEach(function(k){
    var it = cart[k], p = byId(it.id);
    if (!p || it.qty <= 0) return;
    var up = unitPrice(p, it.qty);
    out.push({ key: k, p: p, aroma: it.aroma, qty: it.qty, unit: up, total: up * it.qty });
  });
  return out;
}
function cartUnits(){ return cartItems().reduce(function(a, i){ return a + i.qty; }, 0); }
function cartSubtotal(){ return cartItems().reduce(function(a, i){ return a + i.total; }, 0); }
function setQty(id, aroma, qty){
  var k = cartKey(id, aroma);
  if (qty <= 0) delete cart[k]; else cart[k] = { id: id, aroma: aroma || "", qty: qty };
  save(CART_KEY, cart);
  renderGrid(); renderBar(); if (ui.cartOpen) renderCartBody();
}
function shippingFor(city){
  var rows = DATA.shipping || [];
  for (var i = 0; i < rows.length; i++) if (rows[i].city === city) return rows[i];
  return null;
}
function shippingQuote(){
  var row = shippingFor(form.cidade);
  if (!row) return { known: false, label: "Escolha a cidade para calcular", value: 0 };
  var units = cartUnits(), sub = cartSubtotal();
  if (row.freeFrom && units >= row.freeFrom) return { known: true, label: "Grátis", value: 0, note: "Frete grátis em " + row.city + " a partir de " + row.freeFrom + " unidades" };
  if (row.freeAbove && cartItems().some(function(i){ return /kit/i.test(i.p.category) && i.unit > row.freeAbove; })) return { known: true, label: "Grátis", value: 0, note: "Frete grátis: seu pedido tem um Kit Econômico" };
  if (row.freeAbove && sub > row.freeAbove) return { known: true, label: "Grátis", value: 0, note: "Frete grátis nas compras acima de " + money(row.freeAbove) };
  var hint = row.freeFrom ? "Faltam " + (row.freeFrom - units) + " unidade(s) para frete grátis em " + row.city : (row.freeAbove ? "Frete para " + row.city + ". Compras acima de " + money(row.freeAbove) + " ou com Kit Econômico têm frete grátis." : "");
  if (row.fee == null) return { known: false, label: "A combinar no WhatsApp", value: 0, note: hint || "O frete para " + row.city + " é informado na conversa" };
  var note = hint || "Entrega em " + row.city;
  return { known: true, label: money(row.fee), value: row.fee, note: note };
}

  document.getElementById("q").addEventListener("input", function(e){ ui.q = e.target.value; renderGrid(); });
  document.getElementById("open-cart").addEventListener("click", openCart);
  document.getElementById("open-editor").addEventListener("click", openEditor);
  if (canEdit) document.getElementById("open-editor").hidden = false;
  renderChips(); renderNotice(); renderGrid(); renderBar();
}
function categories(){
  var seen = {}, out = ["Todos"];
  DATA.products.forEach(function(p){ if (p.category && !seen[p.category]){ seen[p.category] = 1; out.push(p.category); } });
  return out;
}
function renderChips(){
  var el = document.getElementById("chips");
  el.innerHTML = categories().map(function(c){ return '<button class="chip" aria-pressed="' + (c === ui.cat) + '" data-cat="' + esc(c) + '">' + esc(c) + '</button>'; }).join("");
  el.onclick = function(e){ var b = e.target.closest("[data-cat]"); if (!b) return; ui.cat = b.getAttribute("data-cat"); renderChips(); renderGrid(); };
}
function renderNotice(){
  var el = document.getElementById("notice");
  var ex = DATA.products.some(function(p){ return p.example; });
  el.innerHTML = ex ? '<p class="notice">Os produtos marcados como <b>exemplo</b> estão aqui só para mostrar o catálogo. Confirme preços e disponibilidade no WhatsApp.</p>' : "";
}
function renderGrid(){
  var q = ui.q.trim().toLowerCase();
  var list = DATA.products.filter(function(p){
    if (ui.cat !== "Todos" && p.category !== ui.cat) return false;
    if (!q) return true;
    return (p.name + " " + p.category + " " + (p.aromas || []).join(" ") + " " + (p.desc || "")).toLowerCase().indexOf(q) >= 0;
  });
  var grid = document.getElementById("grid");
  if (!list.length){ grid.innerHTML = '<div class="empty" style="grid-column:1/-1">Nenhum produto encontrado. Tente outra palavra ou fale com a gente no WhatsApp.</div>'; return; }
  grid.innerHTML = list.map(cardHtml).join("");
  grid.onclick = onGridClick;
  grid.onchange = function(e){ var s = e.target.closest("select[data-aroma]"); if (!s) return; ui.aroma[s.getAttribute("data-aroma")] = s.value; renderGrid(); };
}
function cardHtml(p){
  var aromas = p.aromas || [];
  var aroma = ui.aroma[p.id] || aromas[0] || "";
  var inCart = cart[cartKey(p.id, aroma)];
  var qty = inCart ? inCart.qty : 0;
  var pic = p.photo ? '<img src="' + esc(p.photo) + '" alt="' + esc(p.name) + '">' : icon(p.category);
  var h = '<article class="card"><div class="pic">' + pic +
    (p.example ? '<span class="tag">exemplo</span>' : "") +
    (p.available === false ? '<span class="tag out">esgotado</span>' : "") + '</div><div class="body">' +
    '<span class="cat">' + esc(p.category) + '</span><h3>' + esc(p.name) + '</h3>' +
    (p.size ? '<span class="size">' + esc(p.size) + '</span>' : "") +
    (p.desc ? '<p class="desc">' + esc(p.desc) + '</p>' : "") +
    (p.was != null && p.was > p.price ? '<div class="was num">Separado: <s>' + money(p.was) + '</s> · <b>Economize ' + money(p.was - p.price) + '</b></div>' : "") +
    '<div class="price num">' + money(p.price) + '</div>' +
    (p.tierMin && p.tierPrice != null ? '<div class="tier num">' + p.tierMin + ' ou mais: ' + money(p.tierPrice) + ' cada</div>' : "");
  if (aromas.length){
    h += '<label class="aroma">Aroma<select data-aroma="' + esc(p.id) + '">' + aromas.map(function(a){ return '<option' + (a === aroma ? " selected" : "") + '>' + esc(a) + '</option>'; }).join("") + '</select></label>';
  }
  h += '<div class="actions">';
  if (p.available === false) h += '<button class="add" disabled>Esgotado</button>';
  else if (qty > 0) h += '<div class="stepper"><button data-dec="' + esc(p.id) + '" aria-label="Diminuir">−</button><span class="num">' + qty + ' no carrinho</span><button data-inc="' + esc(p.id) + '" aria-label="Aumentar">+</button></div>';
  else h += '<button class="add" data-inc="' + esc(p.id) + '">Adicionar ao carrinho</button>';
  return h + '</div></div></article>';
}
function onGridClick(e){
  var b = e.target.closest("[data-inc],[data-dec]"); if (!b) return;
  var id = b.getAttribute("data-inc") || b.getAttribute("data-dec");
  var p = byId(id); var aroma = ui.aroma[id] || (p.aromas || [])[0] || "";
  var cur = cart[cartKey(id, aroma)]; var q = cur ? cur.qty : 0;
  setQty(id, aroma, q + (b.hasAttribute("data-inc") ? 1 : -1));
}
function renderBar(){
  var units = cartUnits(), bar = document.getElementById("cartbar");
  bar.hidden = units === 0;
  document.getElementById("barsum").innerHTML = '<b>' + money(cartSubtotal()) + '</b><small>' + units + (units === 1 ? " item" : " itens") + ' no carrinho</small>';
}

/* ---------- cart sheet ---------- */
function openCart(){
  ui.cartOpen = true;
  var cities = (DATA.shipping || []).map(function(r){ return r.city; });
  var root = document.getElementById("sheet-root");
  root.innerHTML = '<div class="sheet-bg" id="sheet-bg"></div><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="cart-title">' +
    '<div class="sheet-head"><div class="in"><h2 id="cart-title">Seu carrinho</h2><button class="x" id="close-cart" aria-label="Fechar carrinho">✕</button></div></div>' +
    '<div class="sec"><div id="cart-lines"></div></div>' +
    '<div class="sec"><h3>Entrega</h3>' +
      '<div class="field"><label for="f-cidade">Cidade</label><select id="f-cidade"><option value="">Escolha a cidade</option>' + cities.map(function(c){ return '<option' + (c === form.cidade ? " selected" : "") + '>' + esc(c) + '</option>'; }).join("") + '</select><span class="fine">Entregamos em ' + esc(cities.join(", ").replace(/, ([^,]*)$/, " e $1")) + '. No momento não atendemos outras regiões.</span><span class="err" id="e-cidade"></span></div>' +
      '<div id="ship-box"></div>' +
      '<div class="field"><label for="f-nome">Seu nome</label><input id="f-nome" autocomplete="name" value="' + esc(form.nome) + '"><span class="err" id="e-nome"></span></div>' +
      '<div class="row2"><div class="field"><label for="f-rua">Rua</label><input id="f-rua" autocomplete="address-line1" value="' + esc(form.rua) + '"><span class="err" id="e-rua"></span></div>' +
        '<div class="field"><label for="f-numero">Número</label><input id="f-numero" inputmode="numeric" value="' + esc(form.numero) + '"></div></div>' +
      '<div class="field"><label for="f-bairro">Bairro</label><input id="f-bairro" value="' + esc(form.bairro) + '"></div>' +
      '<div class="field"><label for="f-pagamento">Forma de pagamento</label><select id="f-pagamento">' + ["Pix","Cartão de débito","Cartão de crédito"].map(function(o){ return '<option' + (o === form.pagamento ? " selected" : "") + '>' + o + '</option>'; }).join("") + '</select></div>' +
      '<div class="field"><label for="f-obs">Observações (opcional)</label><textarea id="f-obs" placeholder="Ponto de referência, horário para entrega...">' + esc(form.obs) + '</textarea></div>' +
    '</div>' +
    '<div class="sec"><div class="totals num" id="totals"></div>' +
      '<a class="wa" id="wa-link" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.2c0-.1-.2-.2-.4-.3z"/></svg>Finalizar pedido no WhatsApp</a>' +
      '<p class="fine">O WhatsApp abre com o pedido já escrito. É só enviar a mensagem para combinar a entrega e o pagamento. Se não abrir, chame no número <b class="num">' + esc(phonePretty()) + '</b> e cole o pedido: <button class="copy" id="copy-msg">Copiar pedido</button> <span id="copy-ok" class="fine"></span></p>' +
    '</div></section>';
  document.getElementById("sheet-bg").onclick = closeCart;
  document.getElementById("close-cart").onclick = closeCart;
  ["nome","cidade","rua","numero","bairro","pagamento","obs"].forEach(function(k){
    var el = document.getElementById("f-" + k);
    el.addEventListener("input", function(){ form[k] = el.value; save(FORM_KEY, form); if (k === "cidade") renderCartBody(); else updateWa(); });
  });
  document.getElementById("wa-link").addEventListener("click", function(e){ if (!validate()){ e.preventDefault(); } });
  document.getElementById("copy-msg").addEventListener("click", function(){
    var ok = document.getElementById("copy-ok"), txt = message();
    var done = function(){ ok.textContent = "Pedido copiado."; };
    try { navigator.clipboard.writeText(txt).then(done, function(){ ok.textContent = "Não foi possível copiar automaticamente."; }); } catch(err){ ok.textContent = "Não foi possível copiar automaticamente."; }
  });
  document.addEventListener("keydown", escClose);
  renderCartBody();
  document.getElementById("close-cart").focus();
}
function escClose(e){ if (e.key === "Escape" && ui.cartOpen) closeCart(); }
function closeCart(){ ui.cartOpen = false; document.getElementById("sheet-root").innerHTML = ""; document.removeEventListener("keydown", escClose); }
function renderCartBody(){
  var items = cartItems(), el = document.getElementById("cart-lines");
  if (!items.length){ el.innerHTML = '<p class="empty">Seu carrinho está vazio. Escolha os produtos no catálogo.</p>'; }
  else el.innerHTML = items.map(function(i){
    return '<div class="line"><div class="nm">' + esc(i.p.name) + (i.aroma ? ' <small>Aroma: ' + esc(i.aroma) + '</small>' : "") + '<small class="num">' + money(i.unit) + ' cada</small></div><div class="tot num">' + money(i.total) + '</div>' +
      '<div class="ctl"><div class="stepper"><button data-k="' + esc(i.key) + '" data-d="-1" aria-label="Diminuir">−</button><span class="num">' + i.qty + '</span><button data-k="' + esc(i.key) + '" data-d="1" aria-label="Aumentar">+</button></div><button class="rm" data-k="' + esc(i.key) + '" data-d="rm">Remover</button></div></div>';
  }).join("");
  el.onclick = function(e){
    var b = e.target.closest("[data-k]"); if (!b) return;
    var it = cart[b.getAttribute("data-k")]; if (!it) return;
    var d = b.getAttribute("data-d");
    setQty(it.id, it.aroma, d === "rm" ? 0 : it.qty + parseInt(d, 10));
  };
  var sq = shippingQuote();
  document.getElementById("ship-box").innerHTML = form.cidade ? '<div class="ship">Frete: ' + esc(sq.label) + (sq.note ? '<small>' + esc(sq.note) + '</small>' : "") + '</div>' : "";
  var sub = cartSubtotal();
  document.getElementById("totals").innerHTML =
    '<span>Subtotal</span><span>' + money(sub) + '</span>' +
    '<span>Frete</span><span>' + esc(form.cidade ? sq.label : "—") + '</span>' +
    '<span class="grand">Total</span><span class="grand">' + money(sub + (sq.known ? sq.value : 0)) + (form.cidade && !sq.known ? " + frete" : "") + '</span>';
  updateWa();
}
function message(){
  var items = cartItems(), sq = shippingQuote(), sub = cartSubtotal();
  var L = ["Olá! Quero fazer um pedido na M&D Limpa&Perfuma:", ""];
  items.forEach(function(i){ L.push("• " + i.qty + "x " + i.p.name + (i.p.size ? " " + i.p.size : "") + (i.aroma ? " (" + i.aroma + ")" : "") + " = " + money(i.total)); });
  L.push("");
  L.push("Subtotal: " + money(sub));
  L.push("Frete" + (form.cidade ? " (" + form.cidade + ")" : "") + ": " + (form.cidade ? sq.label : "a calcular"));
  L.push("Total: " + money(sub + (sq.known ? sq.value : 0)) + (sq.known ? "" : " + frete"));
  L.push("");
  L.push("Nome: " + form.nome);
  L.push("Endereço: " + [form.rua + (form.numero ? ", " + form.numero : ""), form.bairro, form.cidade].filter(function(x){ return x && x.trim(); }).join(" – "));
  L.push("Pagamento: " + form.pagamento);
  if (form.obs.trim()) L.push("Obs.: " + form.obs.trim());
  return L.join("\n");
}
function updateWa(){
  var a = document.getElementById("wa-link"); if (!a) return;
  a.href = "https://wa.me/" + phoneDigits() + "?text=" + encodeURIComponent(message());
}
function validate(){
  var ok = true;
  var set = function(k, msg){ var e = document.getElementById("e-" + k); if (e) e.textContent = msg; if (msg) ok = false; };
  set("nome", form.nome.trim() ? "" : "Informe seu nome.");
  set("cidade", form.cidade ? "" : "Escolha a cidade para calcular o frete.");
  set("rua", form.rua.trim() ? "" : "Informe a rua para a entrega.");
  if (!cartItems().length){ ok = false; }
  if (!ok){ var first = document.querySelector(".err:not(:empty)"); if (first) first.parentNode.querySelector("input,select").focus(); }
  return ok;
}

/* ---------- editor (only for people who can edit this page) ---------- */
var draft = null;
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function openEditor(){
  ui.editing = true;
  var stash = null; try { stash = JSON.parse(sessionStorage.getItem("md-draft") || "null"); } catch(e){}
  draft = stash || clone(DATA);
  try { sessionStorage.removeItem("md-draft"); } catch(e){}
  renderEditor();
}
function closeEditor(){ ui.editing = false; draft = null; document.getElementById("editor-root").innerHTML = ""; }
function renderEditor(){
  var root = document.getElementById("editor-root");
  var hasEx = draft.products.some(function(p){ return p.example; });
  var h = '<section class="editor" aria-labelledby="ed-title"><div class="wrap">' +
    '<div class="ed-head"><h2 id="ed-title">Editar catálogo</h2><button class="btn ghost" id="ed-close">Fechar sem salvar</button></div>' +
    (hasEx ? '<p class="notice">Ainda há produtos e valores de exemplo. Troque pelos seus produtos e preços reais, ou apague os exemplos de uma vez: <button class="btn danger" id="ed-clear-ex">Apagar produtos de exemplo</button></p>' : "") +
    '<div class="panel"><h3>Loja</h3><div class="egrid">' +
      '<div class="field"><label for="s-wa">WhatsApp dos pedidos</label><input id="s-wa" inputmode="tel" value="' + esc(draft.store.whatsapp) + '"></div>' +
      '<div class="field"><label for="s-slogan">Slogan</label><input id="s-slogan" value="' + esc(draft.store.slogan) + '"></div>' +
      '<div class="field"><label for="s-pay">Formas de pagamento</label><input id="s-pay" value="' + esc(draft.store.payments || "") + '"></div>' +
    '</div></div>' +
    '<div class="panel"><h3>Frete por cidade</h3><p class="fine">Deixe o valor em branco para "a combinar no WhatsApp". Para frete grátis, preencha a quantidade mínima de unidades ou o valor mínimo da compra (ou deixe os dois em branco).</p>' +
      '<div class="ship-table"><table><thead><tr><th>Cidade</th><th>Valor do frete (R$)</th><th>Grátis a partir de (un.)</th><th>Grátis acima de (R$)</th><th></th></tr></thead><tbody>' +
      draft.shipping.map(function(r, i){
        return '<tr><td><input data-sh="' + i + '" data-f="city" value="' + esc(r.city) + '" aria-label="Cidade"></td>' +
          '<td><input data-sh="' + i + '" data-f="fee" inputmode="decimal" value="' + (r.fee == null ? "" : String(r.fee).replace(".", ",")) + '" aria-label="Valor do frete"></td>' +
          '<td><input data-sh="' + i + '" data-f="freeFrom" inputmode="numeric" value="' + (r.freeFrom == null ? "" : r.freeFrom) + '" aria-label="Grátis a partir de"></td>' +
          '<td><input data-sh="' + i + '" data-f="freeAbove" inputmode="decimal" value="' + (r.freeAbove == null ? "" : String(r.freeAbove).replace(".", ",")) + '" aria-label="Grátis acima de"></td>' +
          '<td><button class="rm" data-sh-rm="' + i + '">Remover</button></td></tr>';
      }).join("") + '</tbody></table></div><div><button class="btn ghost" id="ed-add-city">Adicionar cidade</button></div></div>' +
    '<div class="ed-head"><h3>Produtos (' + draft.products.length + ')</h3><button class="btn primary" id="ed-add">Adicionar produto</button></div>' +
    draft.products.map(function(p, i){
      return '<div class="panel"><div class="ed-head"><h3>' + esc(p.name || "Produto sem nome") + (p.example ? ' <span class="fine">(exemplo)</span>' : "") + '</h3><button class="btn danger" data-rm="' + i + '">Excluir</button></div>' +
        '<div class="ep-photo"><div class="thumb">' + (p.photo ? '<img src="' + esc(p.photo) + '" alt="">' : icon(p.category)) + '</div>' +
          '<label class="btn ghost" for="ph-' + i + '">Escolher foto</label><input class="sr" type="file" accept="image/*" id="ph-' + i + '" data-photo="' + i + '">' +
          (p.photo ? '<button class="rm" data-photo-rm="' + i + '">Tirar foto</button>' : "") + '</div>' +
        '<div class="egrid">' +
          fld(i, "name", "Nome do produto", p.name) + fld(i, "category", "Categoria", p.category, "cats") + fld(i, "size", "Tamanho (ex.: 2 L)", p.size) +
          fld(i, "price", "Preço (R$)", p.price == null ? "" : String(p.price).replace(".", ","), null, "decimal") +
          fld(i, "tierMin", "Preço por quantidade: a partir de (un.)", p.tierMin == null ? "" : p.tierMin, null, "numeric") +
          fld(i, "tierPrice", "Preço por quantidade (R$ cada)", p.tierPrice == null ? "" : String(p.tierPrice).replace(".", ","), null, "decimal") +
          fld(i, "was", "Preço comprando separado (kits, R$)", p.was == null ? "" : String(p.was).replace(".", ","), null, "decimal") +
          fld(i, "aromas", "Aromas (separe por vírgula)", (p.aromas || []).join(", ")) + fld(i, "desc", "Descrição curta", p.desc) +
        '</div><label class="check"><input type="checkbox" data-p="' + i + '" data-f="available"' + (p.available === false ? "" : " checked") + '> Disponível</label></div>';
    }).join("") +
    '<datalist id="cats">' + categories().slice(1).map(function(c){ return '<option value="' + esc(c) + '">'; }).join("") + '</datalist>' +
    '</div><div class="savebar"><div class="wrap"><span class="status" id="ed-status" role="status"></span><button class="btn ghost" id="ed-cancel">Cancelar</button><button class="btn primary" id="ed-save">Salvar e publicar</button></div></div></section>';
  root.innerHTML = h;
  var sec = root.querySelector(".editor");
  sec.addEventListener("input", onEditInput);
  sec.addEventListener("change", onEditChange);
  sec.addEventListener("click", onEditClick);
}
function fld(i, f, label, val, list, mode){
  return '<div class="field"><label for="p-' + i + '-' + f + '">' + label + '</label><input id="p-' + i + '-' + f + '" data-p="' + i + '" data-f="' + f + '" value="' + esc(val == null ? "" : val) + '"' + (list ? ' list="' + list + '"' : "") + (mode ? ' inputmode="' + mode + '"' : "") + '></div>';
}
function onEditInput(e){
  var t = e.target;
  if (t.id === "s-wa"){ draft.store.whatsapp = t.value; return; }
  if (t.id === "s-slogan"){ draft.store.slogan = t.value; return; }
  if (t.id === "s-pay"){ draft.store.payments = t.value; return; }
  if (t.hasAttribute("data-sh")){
    var r = draft.shipping[+t.getAttribute("data-sh")], f = t.getAttribute("data-f");
    if (f === "city") r.city = t.value; else if (f === "fee" || f === "freeAbove") r[f] = num(t.value); else { var n = parseInt(t.value, 10); r.freeFrom = isNaN(n) ? null : n; }
    return;
  }
  if (t.hasAttribute("data-p") && t.type !== "checkbox"){
    var p = draft.products[+t.getAttribute("data-p")], k = t.getAttribute("data-f");
    if (k === "price" || k === "tierPrice" || k === "was") p[k] = num(t.value);
    else if (k === "tierMin"){ var m = parseInt(t.value, 10); p.tierMin = isNaN(m) ? null : m; }
    else if (k === "aromas") p.aromas = t.value.split(",").map(function(s){ return s.trim(); }).filter(Boolean);
    else p[k] = t.value;
    if (p.example && (k === "name" || k === "price")) p.example = false;
  }
}
function onEditChange(e){
  var t = e.target;
  if (t.type === "checkbox" && t.hasAttribute("data-p")){ draft.products[+t.getAttribute("data-p")].available = t.checked; return; }
  if (t.hasAttribute("data-photo") && t.files && t.files[0]){
    var i = +t.getAttribute("data-photo");
    shrink(t.files[0], function(url){ if (url){ draft.products[i].photo = url; renderEditor(); } else status("Não consegui ler essa imagem. Tente uma foto JPG ou PNG."); });
  }
}
function onEditClick(e){
  var t = e.target, a;
  if (t.id === "ed-close" || t.id === "ed-cancel"){ closeEditor(); return; }
  if (t.id === "ed-save"){ publishDraft(); return; }
  if (t.id === "ed-add"){ draft.products.unshift({ id: "p" + Date.now().toString(36), name: "", category: "", size: "", price: null, tierMin: null, tierPrice: null, was: null, aromas: [], desc: "", photo: "", available: true }); renderEditor(); return; }
  if (t.id === "ed-add-city"){ draft.shipping.push({ city: "", fee: null, freeFrom: null, freeAbove: null }); renderEditor(); return; }
  if (t.id === "ed-clear-ex"){ draft.products = draft.products.filter(function(p){ return !p.example; }); renderEditor(); return; }
  if ((a = t.getAttribute("data-rm")) != null){ draft.products.splice(+a, 1); renderEditor(); return; }
  if ((a = t.getAttribute("data-sh-rm")) != null){ draft.shipping.splice(+a, 1); renderEditor(); return; }
  if ((a = t.getAttribute("data-photo-rm")) != null){ draft.products[+a].photo = ""; renderEditor(); return; }
}
function shrink(file, cb){
  var fr = new FileReader();
  fr.onload = function(){
    var img = new Image();
    img.onload = function(){
      var max = 480, w = img.width, h = img.height, s = Math.min(1, max / Math.max(w, h));
      var c = document.createElement("canvas"); c.width = Math.round(w * s); c.height = Math.round(h * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      try { cb(c.toDataURL("image/jpeg", 0.8)); } catch(e){ cb(null); }
    };
    img.onerror = function(){ cb(null); };
    img.src = fr.result;
  };
  fr.onerror = function(){ cb(null); };
  fr.readAsDataURL(file);
}
function status(t){ var s = document.getElementById("ed-status"); if (s) s.textContent = t; }
function problems(d){
  var out = [];
  d.products.forEach(function(p, i){
    if (!p.name || !p.name.trim()) out.push("Um produto está sem nome.");
    else if (p.price == null) out.push("\"" + p.name + "\" está sem preço.");
    if (!p.category || !p.category.trim()) p.category = "Outros";
  });
  d.shipping = d.shipping.filter(function(r){ return r.city && r.city.trim(); });
  if (String(d.store.whatsapp || "").replace(/\D/g, "").length < 10) out.push("Confira o número de WhatsApp (com DDD).");
  return out;
}
function documentFrom(data){
  var reset = (document.head.querySelector("style") || {}).textContent || "";
  var keep = Array.prototype.map.call(document.querySelectorAll("[data-keep]"), function(el){ return el.outerHTML; }).join("");
  var json = JSON.stringify(data).replace(/</g, "\\u003c");
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + '</style></head><body>' +
    keep + '<div id="app"></div><script type="application/json" id="catalog-data">' + json + '<\/script>' + document.getElementById("app-js").outerHTML + '</body></html>';
}
async function publishDraft(){
  var d = clone(draft);
  var errs = problems(d);
  if (errs.length){ status(errs[0]); return; }
  d.store.whatsapp = String(d.store.whatsapp).replace(/\D/g, "");
  var art = await claude.use("artifact");
  if (!art){ status("Não foi possível salvar daqui. Abra o catálogo no Claude para editar."); return; }
  status("Salvando...");
  try { sessionStorage.setItem("md-draft", JSON.stringify(draft)); } catch(e){}
  try {
    await art.publish(documentFrom(d));
    try { sessionStorage.removeItem("md-draft"); } catch(e){}
    status("Catálogo publicado.");
  } catch(err){
    var code = err && err.code;
    if (code === "conflict") status("Outra versão foi salva agora há pouco. A página vai recarregar com ela; suas alterações continuam no editor.");
    else if (code === "not_writer" || code === "not_granted") { try { sessionStorage.removeItem("md-draft"); } catch(e){} status("Esta conta não tem permissão para editar o catálogo."); }
    else status("Não foi possível salvar agora (" + (code || "erro") + "). Tente de novo em instantes.");
  }
}

renderShell();
(async function(){
  try {
    if (!window.claude || !claude.use) return;
    var u = await claude.use("user");
    canEdit = !!(u && await u.canEdit());
    var b = document.getElementById("open-editor"); if (b) b.hidden = !canEdit;
    var pending = null; try { pending = sessionStorage.getItem("md-draft"); } catch(e){}
    if (canEdit && pending) openEditor();
  } catch(e){}
})();
})();
